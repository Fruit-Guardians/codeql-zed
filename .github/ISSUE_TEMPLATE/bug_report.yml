name: Bug report
description: Report a reproducible problem with the CodeQL Zed extension.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please include the smallest reproducible example and the relevant Zed/CodeQL versions.
  - type: input
    id: zed-version
    attributes:
      label: Zed version
      placeholder: 1.16.1
    validations:
      required: true
  - type: input
    id: codeql-version
    attributes:
      label: CodeQL CLI version
      placeholder: 2.26.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, a minimal query, and expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant output from Zed's language-server log.
      render: text
