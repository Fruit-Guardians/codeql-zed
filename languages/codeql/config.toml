name = "CodeQL"
grammar = "ql"
path_suffixes = ["ql", "qll"]
line_comments = ["// "]
tab_size = 2
hard_tabs = false
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "line_comment", "block_comment"] },
    { start = "/*", end = "*/", close = true, newline = false, not_in = ["string", "line_comment", "block_comment"] },
]
